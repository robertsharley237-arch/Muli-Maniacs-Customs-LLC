<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart • Multi-Maniacs Customs LLC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>

        <li class="cart-nav">
            <a href="Cart.html">
                Cart <span id="cart-count" class="cart-badge">0</span>
            </a>
            <div id="mini-cart" class="mini-cart-dropdown"></div>
        </li>
    </ul>
</nav>

<div class="page">
    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <div class="totals-box">
        <p>Subtotal: <span id="subtotal">$0.00</span></p>
        <p>Tax (6%): <span id="tax">$0.00</span></p>
        <h2>Total: <span id="total">$0.00</span></h2>

        <button onclick="checkout()" class="btn">Proceed to Checkout</button>
        <a href="shop.html" class="btn">Back to Shop</a>
    </div>

    <h2>Saved for later</h2>
    <div id="saved-items"></div>
</div>

<script src="products.js"></script>
<script src="cart.js"></script>

</body>
</html>
