<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }
        #checkoutBtn {
            padding: 15px 30px;
            background: red;
            color: white;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Checkout</h1>
    <p>Click below to complete your order.</p>

    <button id="checkoutBtn">Pay Now</button>

    <script>
        const cart = JSON.parse(localStorage.getItem("MMC_CART")) || [];

        document.getElementById("checkoutBtn").addEventListener("click", async () => {
            const response = await fetch("https://multi-maniacs-customs-backend.onrender.com/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items: cart })  // MUST be "items"
            });

            const data = await response.json();

            if (data.url) {
                window.location.href = data.url; // Redirect to Stripe Checkout
            } else {
                alert("Checkout failed: " + data.error);
            }
        });
    </script>

</body>
</html>
