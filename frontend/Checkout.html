<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Multi Maniacs Customs</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }

        .checkout-row {
            display: flex;
            gap: 20px;
            background: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .checkout-img {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
        }

        .checkout-info p {
            margin: 5px 0;
        }

        #checkout-total {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #2196F3;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }
    </style>
</head>
<script src="navigation.js"></script>

<body>

    <div class="container">
        <h2>Checkout</h2>

        <div id="checkout-items"></div>

        <p id="checkout-total"></p>

        <button onclick="checkout()">Complete Purchase</button>
    </div>

    <script src="checkout.js"></script>

</body>
</html>
