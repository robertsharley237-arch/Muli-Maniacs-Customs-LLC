<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Create a new product category for Multi-Maniacs Customs LLC."
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>
    Add Category | Multi-Maniacs Customs LLC
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

  <style>
    /* ========================================================
       MMC ADD CATEGORY PAGE
       Page-specific layout only.
       Shared administrator styles are controlled by admin.css.
       ======================================================== */

    .add-category-page {
      width: calc(100% - 32px);
      max-width: 820px;
      margin: 34px auto;
    }

    .add-category-container {
      position: relative;
      overflow: hidden;
      padding: 30px;
      color: var(--admin-black, #000000);
      background: var(--admin-panel, rgba(255, 255, 255, 0.95));
      border: 3px solid var(--admin-black, #000000);
      border-radius: 16px;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.38),
        0 0 0 4px rgba(255, 255, 255, 0.22);
    }

    .add-category-heading {
      margin: 0 0 10px;
      color: var(--admin-black, #000000);
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.15;
      text-align: center;
    }

    .add-category-description {
      max-width: 660px;
      margin: 0 auto 24px;
      color: var(--admin-muted, #333333);
      line-height: 1.65;
      text-align: center;
    }

    .admin-account-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      padding: 16px;
      color: var(--admin-white, #ffffff);
      background: var(--admin-black, #000000);
      border: 3px solid var(--admin-black, #000000);
      border-radius: 10px;
    }

    .admin-account-bar p {
      margin: 4px 0;
      color: var(--admin-white, #ffffff);
    }

    .admin-account-bar strong {
      color: var(--admin-cyan, #00eaff);
    }

    .admin-account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .small-action-button,
    .return-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 9px 13px;
      color: var(--admin-white, #ffffff);
      background: var(--admin-dark-gray, #222222);
      border: 2px solid var(--admin-white, #ffffff);
      border-radius: 7px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .small-action-button:hover,
    .small-action-button:focus,
    .return-button:hover,
    .return-button:focus {
      color: var(--admin-black, #000000);
      background:
        linear-gradient(
          135deg,
          var(--admin-pink, #ff1493),
          var(--admin-yellow, #ffe600),
          var(--admin-green, #34e600),
          var(--admin-cyan, #00eaff)
        );
      transform: translateY(-2px);
      box-shadow:
        0 0 12px rgba(255, 20, 147, 0.42),
        0 0 16px rgba(0, 234, 255, 0.28);
    }

    .logout-action-button {
      color: var(--admin-white, #ffffff);
      background: var(--admin-red, #e53935);
    }

    .logout-action-button:hover,
    .logout-action-button:focus {
      color: var(--admin-white, #ffffff);
      background: #b71c1c;
    }

    .add-category-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      color: var(--admin-black, #000000);
      font-size: 15px;
      font-weight: 800;
    }

    .required-marker {
      color: var(--admin-error-text, #b00024);
    }

    .field-help {
      margin: 0;
      color: var(--admin-muted, #333333);
      font-size: 13px;
      line-height: 1.5;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 11px 12px;
      color: var(--admin-black, #000000);
      background: var(--admin-white, #ffffff);
      border: 2px solid var(--admin-black, #000000);
      border-radius: 8px;
      font: inherit;
    }

    .form-field input {
      min-height: 48px;
    }

    .form-field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--admin-purple, #8a00ff);
      box-shadow:
        0 0 0 4px rgba(138, 0, 255, 0.2),
        0 0 12px rgba(0, 234, 255, 0.35);
    }

    .form-field input:disabled,
    .form-field textarea:disabled {
      color: #666666;
      background: #eeeeee;
      cursor: not-allowed;
      opacity: 0.75;
    }

    .form-row {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .character-count {
      margin: 0;
      color: var(--admin-muted, #333333);
      font-size: 12px;
      text-align: right;
    }

    .checkbox-field {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 15px;
      color: var(--admin-black, #000000);
      background:
        linear-gradient(
          135deg,
          rgba(255, 20, 147, 0.1),
          rgba(255, 230, 0, 0.13),
          rgba(52, 230, 0, 0.1),
          rgba(0, 234, 255, 0.12)
        );
      border: 2px solid var(--admin-black, #000000);
      border-radius: 9px;
    }

    .checkbox-field input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin: 2px 0 0;
      accent-color: var(--admin-purple, #8a00ff);
      cursor: pointer;
    }

    .checkbox-field label {
      color: var(--admin-black, #000000);
      font-weight: 800;
      line-height: 1.5;
      cursor: pointer;
    }

    .category-image-preview-container {
      padding: 18px;
      color: var(--admin-black, #000000);
      background: var(--admin-off-white, #fffdf8);
      border: 2px solid var(--admin-black, #000000);
      border-radius: 10px;
      text-align: center;
    }

    .category-image-preview-container[hidden] {
      display: none;
    }

    .category-image-preview-container h2 {
      margin: 0 0 14px;
      color: var(--admin-black, #000000);
      font-size: 18px;
    }

    .category-image-preview {
      display: block;
      width: 100%;
      max-width: 360px;
      max-height: 260px;
      margin: 0 auto;
      background: var(--admin-white, #ffffff);
      border: 2px solid var(--admin-black, #000000);
      border-radius: 9px;
      object-fit: contain;
    }

    .category-explanation {
      padding: 16px;
      color: var(--admin-muted, #333333);
      background: var(--admin-off-white, #fffdf8);
      border: 2px solid var(--admin-black, #000000);
      border-radius: 9px;
      line-height: 1.6;
    }

    .category-explanation strong {
      color: var(--admin-black, #000000);
    }

    .add-category-button {
      display: inline-flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      color: var(--admin-black, #000000);
      background:
        linear-gradient(
          135deg,
          var(--admin-pink, #ff1493),
          var(--admin-yellow, #ffe600),
          var(--admin-green, #34e600),
          var(--admin-cyan, #00eaff)
        );
      border: 3px solid var(--admin-black, #000000);
      border-radius: 9px;
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 6px 0 var(--admin-black, #000000);
      transition:
        filter 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .add-category-button:hover:not(:disabled),
    .add-category-button:focus:not(:disabled) {
      filter: saturate(1.25) brightness(1.05);
      transform: translateY(-2px);
      box-shadow:
        0 8px 0 var(--admin-black, #000000),
        0 0 15px rgba(255, 20, 147, 0.48);
    }

    .add-category-button:disabled {
      cursor: wait;
      filter: grayscale(0.65);
      opacity: 0.65;
      transform: none;
      box-shadow:
        0 4px 0 var(--admin-black, #000000);
    }

    .category-message {
      min-height: 24px;
      margin: 18px 0 0;
      padding: 0;
      border-radius: 9px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
    }

    .category-message:not(:empty) {
      padding: 12px 14px;
      border: 2px solid currentColor;
    }

    .category-error {
      color: var(--admin-error-text, #b00024);
      background: #fff0f3;
    }

    .category-success {
      color: var(--admin-success-text, #126b17);
      background: #effff2;
    }

    .category-information {
      color: var(--admin-information-text, #003d9c);
      background: #edf8ff;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    @media (max-width: 650px) {
      .add-category-page {
        width: calc(100% - 24px);
        margin: 22px auto;
      }

      .add-category-container {
        padding: 22px 16px;
      }

      .admin-account-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .admin-account-actions {
        width: 100%;
        flex-direction: column;
      }

      .small-action-button,
      .return-button {
        width: 100%;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .add-category-button {
        min-height: 48px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body class="add-category-page">
  <div class="add-category-container">
    <h1 class="add-category-heading">
      Add New Product Category
    </h1>
    <p class="add-category-description">
      Create a new product category for Multi-Maniacs Customs LLC. Fill out the form below to add a category, including its name, description, and an optional image. You can also specify whether the category should be visible to customers or hidden from view.
    </p>
