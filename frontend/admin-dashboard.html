<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard • Multi-Maniacs Customs LLC</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================
         UPDATED BLACK HEADER
         ============================ -->
    <header class="top-header">
        <h1>Multi-Maniacs Customs LLC — Admin</h1>

        <nav class="header-buttons">

            <button onclick="navigate('home')">
                <span class="icon">🏠</span> Home
            </button>

            <button onclick="navigate('about')">
                <span class="icon">📘</span> About
            </button>

            <button onclick="navigate('services')">
                <span class="icon">🛠️</span> Services
            </button>

            <button onclick="navigate('shop')">
                <span class="icon">🛒</span> Shop
            </button>

            <button onclick="navigate('cart')">
                <span class="icon">🛍️</span> Cart
            </button>

            <button onclick="navigate('contact')">
                <span class="icon">📞</span> Contact
            </button>

            <button onclick="navigate('gallery')">
                <span class="icon">🖼️</span> Gallery
            </button>

            <!-- ⭐ ADMIN BUTTON (current page) ⭐ -->
            <button class="admin-btn" onclick="navigate('admin-dashboard')">
                <span class="icon">🔧</span> Admin
            </button>

        </nav>

        <!-- MINI CART -->
        <div class="mini-cart" id="miniCart">
            <h3>Mini Cart</h3>
            <div id="miniCartItems"></div>
        </div>
    </header>


    <!-- ============================
         ADMIN SIDEBAR + AUTH CHECK
         ============================ -->
    <script src="admin-sidebar.html"></script>

    <script>
        const token = localStorage.getItem("MMC_ADMIN_TOKEN");
        if (!token) window.location.href = "admin-login.html";
    </script>


    <!-- ============================
         ADMIN DASHBOARD CONTENT
         ============================ -->
    <div class="admin-page" style="padding: 20px;">
        <h1>Admin Dashboard</h1>

        <div class="section">
            <h2>Store Overview</h2>

            <p><strong>Total Products:</strong> <span id="totalProducts">0</span></p>
            <p><strong>Total Variants:</strong> <span id="totalVariants">0</span></p>
            <p><strong>Active Products:</strong> <span id="activeProducts">0</span></p>
        </div>

        <div class="section">
            <h2>Quick Actions</h2>

            <button onclick="go('admin-add-product.html')">Add Product</button>
            <button onclick="go('admin-products.html')">Manage Products</button>
            <button onclick="go('admin.html')">Advanced Editor</button>
        </div>
    </div>


    <!-- ============================
         SCRIPTS
         ============================ -->
    <script src="admin-dashboard.js"></script>
    <script src="navigation.js"></script>

</body>
</html>
