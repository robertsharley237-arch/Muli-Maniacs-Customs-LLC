<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Delete a product from Multi-Maniacs Customs LLC."
  >

  <title>
    Delete Product | Multi-Maniacs Customs LLC
  </title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">

  <style>
    :root {
      --delete-product-background: #111111;
      --delete-product-panel: #222222;
      --delete-product-inner: #191919;
      --delete-product-border: #444444;
      --delete-product-text: #ffffff;
      --delete-product-muted: #cccccc;
      --delete-product-input-background: #ffffff;
      --delete-product-input-text: #111111;
      --delete-product-danger: #e53935;
      --delete-product-danger-hover: #c62828;
      --delete-product-danger-disabled: #713b39;
      --delete-product-focus: #ff8a80;
      --delete-product-error: #ff7676;
      --delete-product-success: #79d77c;
      --delete-product-information: #90caf9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--delete-product-text);
      background: var(--delete-product-background);
      font-family: Arial, Helvetica, sans-serif;
    }

    .top-header {
      padding: 18px 20px;
      background: #000000;
      border-bottom: 1px solid var(--delete-product-border);
    }

    .header-content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .site-heading {
      margin: 0 0 16px;
      font-size: 26px;
      line-height: 1.25;
    }

    .header-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-buttons a {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 13px;
      color: #ffffff;
      background: #222222;
      border: 1px solid #353535;
      border-radius: 7px;
      text-decoration: none;
    }

    .header-buttons a:hover,
    .header-buttons a:focus {
      background: #333333;
    }

    .header-buttons a[aria-current="page"] {
      background: var(--delete-product-danger);
      border-color: var(--delete-product-danger);
    }

    .delete-product-page {
      width: 100%;
      max-width: 720px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .delete-product-container {
      padding: 30px;
      background: var(--delete-product-panel);
      border: 1px solid var(--delete-product-border);
      border-radius: 14px;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.4);
    }

    .page-heading {
      margin: 0 0 10px;
      text-align: center;
      font-size: 30px;
    }

    .page-description {
      max-width: 600px;
      margin: 0 auto 24px;
      color: var(--delete-product-muted);
      text-align: center;
      line-height: 1.55;
    }

    .admin-account-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px;
      background: var(--delete-product-inner);
      border: 1px solid var(--delete-product-border);
      border-radius: 8px;
    }

    .admin-account-bar p {
      margin: 4px 0;
    }

    .admin-account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .small-action-button {
      display: inline-block;
      padding: 9px 13px;
      color: #ffffff;
      background: #444444;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .small-action-button:hover,
    .small-action-button:focus {
      background: #5a5a5a;
    }

    .delete-product-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      font-size: 15px;
      font-weight: 700;
    }

    .form-field select {
      width: 100%;
      min-height: 50px;
      padding: 11px 12px;
      color: var(--delete-product-input-text);
      background: var(--delete-product-input-background);
      border: 2px solid transparent;
      border-radius: 7px;
      font: inherit;
      outline: none;
      cursor: pointer;
    }

    .form-field select:focus {
      border-color: var(--delete-product-focus);
      box-shadow:
        0 0 0 3px rgba(255, 138, 128, 0.2);
    }

    .form-field select:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .product-details {
      padding: 18px;
      background: var(--delete-product-inner);
      border: 1px solid var(--delete-product-border);
      border-radius: 9px;
    }

    .product-details[hidden] {
      display: none;
    }

    .product-details h2 {
      margin: 0 0 14px;
      font-size: 21px;
    }

    .product-detail-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
      align-items: start;
    }

    .selected-product-image {
      display: block;
      width: 180px;
      height: 180px;
      object-fit: cover;
      background: #101010;
      border: 1px solid var(--delete-product-border);
      border-radius: 8px;
    }

    .selected-product-image[hidden] {
      display: none;
    }

    .product-information p {
      margin: 7px 0;
      color: var(--delete-product-muted);
      line-height: 1.45;
    }

    .product-information strong {
      color: var(--delete-product-text);
    }

    .delete-warning {
      padding: 16px;
      color: #ffffff;
      background: #3b2020;
      border: 1px solid #b94a48;
      border-radius: 8px;
      line-height: 1.55;
    }

    .delete-warning strong {
      display: block;
      margin-bottom: 6px;
    }

    .confirmation-field {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      background: var(--delete-product-inner);
      border: 1px solid var(--delete-product-border);
      border-radius: 8px;
    }

    .confirmation-field input {
      width: 20px;
      height: 20px;
      margin: 1px 0 0;
      accent-color: var(--delete-product-danger);
      cursor: pointer;
    }

    .confirmation-field label {
      line-height: 1.45;
      cursor: pointer;
    }

    .delete-product-button {
      width: 100%;
      min-height: 52px;
      padding: 13px;
      color: #ffffff;
      background: var(--delete-product-danger);
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background-color 0.2s ease,
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .delete-product-button:hover:not(:disabled) {
      background: var(--delete-product-danger-hover);
      transform: translateY(-1px);
    }

    .delete-product-button:focus-visible {
      outline: 3px solid var(--delete-product-focus);
      outline-offset: 3px;
    }

    .delete-product-button:disabled {
      background: var(--delete-product-danger-disabled);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .product-message {
      min-height: 24px;
      margin: 18px 0 0;
      text-align: center;
      font-weight: 700;
      line-height: 1.5;
    }

    .product-message:empty {
      display: none;
    }

    .product-error {
      color: var(--delete-product-error);
    }

    .product-success {
      color: var(--delete-product-success);
    }

    .product-information-message {
      color: var(--delete-product-information);
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    @media (max-width: 650px) {
      .delete-product-page {
        margin: 20px auto;
        padding: 0 14px;
      }

      .delete-product-container {
        padding: 22px 16px;
      }

      .product-detail-grid {
        grid-template-columns: 1fr;
      }

      .selected-product-image {
        width: 100%;
        height: 240px;
      }

      .admin-account-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-buttons {
        flex-direction: column;
      }

      .header-buttons a {
        width: 100%;
      }
    }
  </style>

  <script src="navigation.js" defer></script>
  <script src="delete-product.js" defer></script>
</head>

<body>
  <header class="top-header">
    <div class="header-content">
