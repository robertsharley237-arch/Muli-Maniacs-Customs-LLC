<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Intakes - Admin</title>
  <style>
    body { background:#000; color:#fff; font-family:Arial; padding:20px; }
    .intake { background:#111; padding:15px; margin-bottom:20px; border-radius:8px; }
    img { width:200px; border-radius:8px; margin-top:10px; }
  </style>
</head>
<body>

<h1>Client Intakes</h1>
<div id="intake-list"></div>

<script>
async function loadIntakes() {
  const res = await fetch("https://multi-maniacs-customs-backend.onrender.com/intake/all");
  const intakes = await res.json();

  const container = document.getElementById("intake-list");
  container.innerHTML = "";

  intakes.forEach(i => {
    const div = document.createElement("div");
    div.classList.add("intake");

    div.innerHTML = `
      <h2>${i.name}</h2>
      <p><strong>Phone:</strong> ${i.phone}</p>
      <p><strong>Email:</strong> ${i.email}</p>
      <p><strong>Preferred Contact:</strong> ${i.contactMethod}</p>
      <p><strong>Project Type:</strong> ${i.projectType}</p>
      <p><strong>Budget:</strong> ${i.budget}</p>
      <p><strong>Timeline:</strong> ${i.timeline}</p>
      <p><strong>Location:</strong> ${i.location}</p>
      <p><strong>Description:</strong><br>${i.description}</p>
      ${i.imageUrl ? `<img src="${i.imageUrl}">` : ""}
      <p><em>Submitted: ${new Date(i.createdAt).toLocaleString()}</em></p>
    `;

    container.appendChild(div);
  });
}

loadIntakes();
</script>

</body>
</html>
