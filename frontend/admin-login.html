<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMC Admin Portal</title>

<style>

:root{
    --bg:#111111;
    --panel:#1b1b1b;
    --accent:#4CAF50;
    --accent-hover:#43a047;
    --text:#ffffff;
    --error:#ff6666;
    --success:#66ff99;
    --border:#303030;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:450px;
    margin:20px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:30px;
    box-shadow:0 0 25px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    margin-bottom:10px;
}

.logo h1{
    margin:0;
    font-size:28px;
}

.logo p{
    margin:5px 0 0;
    color:#cccccc;
}

input{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:6px;
}

input:focus{
    outline:none;
    border-color:var(--accent);
}

button{
    width:100%;
    padding:12px;
    margin-top:18px;
    background:var(--accent);
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:var(--accent-hover);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

#admin-login-message{
    margin-top:15px;
    text-align:center;
    min-height:24px;
}

.login-error{
    color:var(--error);
}

.login-success{
    color:var(--success);
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Multi-Maniacs Customs LLC</h1>
        <p>Admin Portal</p>
    </div>

    <form id="admin-login-form">

        <input
            id="adminUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            id="adminPassword"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button
            id="admin-login-button"
            type="submit"
        >
            Log In
        </button>

    </form>

    <div id="admin-login-message"></div>

    <div class="footer">
        MMC Administrative Access Only
    </div>

</div>

<script src="navigation.js"></script>
<script src="admin-login.js"></script>

</body>
</html>
