<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMC Admin Login</title>

<style>
body{
    margin:0;
    padding:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:400px;
    margin:100px auto;
    padding:25px;
    background:#222;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#43a047;
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

#admin-login-message{
    margin-top:15px;
    text-align:center;
}

.login-error{
    color:#ff6b6b;
}

.login-success{
    color:#7dff7d;
}
</style>
</head>

<body>

<div class="container">

    <h1>Admin Login</h1>

    <form id="admin-login-form">

        <input
            type="text"
            id="adminUsername"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            id="admin-login-button"
        >
            Log In
        </button>

    </form>

    <div id="admin-login-message"></div>

</div>

<script src="admin-login.js"></script>

</body>
</html>
