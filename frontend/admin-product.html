<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MMC Admin – Edit Product</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================
         UPDATED BLACK HEADER
         ============================ -->
    <header class="top-header">
        <h1>Multi-Maniacs Customs LLC — Admin</h1>

        <nav class="header-buttons">

            <button onclick="navigate('home')">
                <span class="icon">🏠</span> Home
            </button>

            <button onclick="navigate('about')">
                <span class="icon">📘</span> About
            </button>

            <button onclick="navigate('services')">
                <span class="icon">🛠️</span> Services
            </button>

            <button onclick="navigate('shop')">
                <span class="icon">🛒</span> Shop
            </button>

            <button onclick="navigate('cart')">
                <span class="icon">🛍️</span> Cart
            </button>

            <button onclick="navigate('contact')">
                <span class="icon">📞</span> Contact
            </button>

            <button onclick="navigate('gallery')">
                <span class="icon">🖼️</span> Gallery
            </button>

            <!-- ⭐ ADMIN BUTTON ⭐ -->
            <button class="admin-btn" onclick="navigate('admin-dashboard')">
                <span class="icon">🔧</span> Admin
            </button>

        </nav>

        <!-- MINI CART -->
        <div class="mini-cart" id="miniCart">
            <h3>Mini Cart</h3>
            <div id="miniCartItems"></div>
        </div>
    </header>


    <!-- ============================
         SIDEBAR + AUTH PROTECTION
         ============================ -->
    <script src="admin-sidebar.html"></script>

    <script>
        const token = localStorage.getItem("MMC_ADMIN_TOKEN");
        if (!token) window.location.href = "admin-login.html";
    </script>


    <!-- ============================
         PAGE CONTENT
         ============================ -->
    <div class="admin-page" style="padding: 20px;">
        <h1>Edit Product</h1>

        <div class="section">
            <h2>Product Details</h2>

            <label>Name:</label>
            <input id="p-name">

            <label>SKU:</label>
            <input id="p-sku">

            <label>Price:</label>
            <input id="p-price" type="number">

            <label>Stock:</label>
            <input id="p-stock" type="number">

            <label>Category:</label>
            <input id="p-category">

            <label>Description:</label>
            <textarea id="p-description"></textarea>

            <label>Image URL:</label>
            <input id="p-image">

            <label>Upload New Image:</label>
            <input type="file" id="p-image-file">
            <button onclick="uploadProductImage()">Upload Image</button>

            <img id="p-preview" style="margin-top: 10px; max-width: 200px; border-radius: 10px;">
        </div>

        <div class="section">
            <h2>Variants</h2>

            <div id="variantList"></div>

            <h3>Add Variant</h3>
            <input id="v-name" placeholder="Variant Name">
            <input id="v-sku" placeholder="Variant SKU">
            <input id="v-price" placeholder="Variant Price" type="number">
            <input id="v-stock" placeholder="Variant Stock" type="number">
            <button onclick="addVariant()">Add Variant</button>
        </div>

        <div class="section">
            <button onclick="saveProduct()" class="btn">Save Product</button>
            <button onclick="deleteProduct()" class="btn danger">Delete Product</button>
        </div>
    </div>


    <!-- ============================
         SCRIPTS
         ============================ -->
    <script src="admin-product.js"></script>
    <script src="navigation.js"></script>

</body>
</html>
