<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard • Multi-Maniacs Customs LLC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="Cart.html">Cart</a></li>
        <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
</nav>

<div class="page">
    <h1>Admin Dashboard</h1>

    <h2>Add New Product</h2>
    <div class="admin-box">
        <input id="p-name" placeholder="Product Name">
        <input id="p-sku" placeholder="SKU (MMC-001)">
        <input id="p-price" placeholder="Base Price">
        <input type="file" id="p-image-file">
<button onclick="uploadImage()" class="btn-small">Upload Image</button>
<input id="p-image" placeholder="Image URL (auto-filled)">

        <input id="p-stock" placeholder="Stock">
        <input id="p-category" placeholder="Category">
        <textarea id="p-desc" placeholder="Description"></textarea>

        <button onclick="addProduct()" class="btn">Add Product</button>
    </div>

    <h2>Products</h2>
    <div id="admin-products"></div>
</div>

<script src="admin.js"></script>

</body>
</html>
