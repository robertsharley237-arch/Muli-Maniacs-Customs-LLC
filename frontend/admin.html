<!DOCTYPE html>
<html>
<head>
    <title>MMC Admin Dashboard</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            margin-left: 270px;
            padding: 20px;
        }
        .card {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<script src="navigation.js"></script>

<body>

    <!-- Sidebar -->
    <script src="admin-sidebar.html"></script>

    <h1>Admin Dashboard</h1>

    <div class="card">
        <h2>Total Products</h2>
        <p id="productCount">Loading...</p>
    </div>

    <div class="card">
        <h2>Total Orders</h2>
        <p id="orderCount">Loading...</p>
    </div>

    <script>
        async function loadStats() {
            const products = await fetch("https://multi-maniacscustoms.vercel.app/products").then(r => r.json());
            const orders = await fetch("https://multi-maniacscustoms.vercel.app/orders").then(r => r.json());

            document.getElementById("productCount").innerText = products.length;
            document.getElementById("orderCount").innerText = orders.length;
        }

        loadStats();
    </script>

</body>
</html>
