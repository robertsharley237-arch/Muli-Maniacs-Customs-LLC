<!DOCTYPE html>
<html>
<head>
    <title>Delete Category</title>
    <style>
        body { background:#111; color:white; font-family:Arial; padding:20px; }
        .container { max-width:500px; margin:auto; background:#222; padding:20px; border-radius:10px; }
        input { width:100%; padding:10px; margin-top:10px; border-radius:6px; border:none; }
        button { width:100%; padding:12px; margin-top:15px; background:#E53935; border:none; color:white; font-size:16px; border-radius:6px; cursor:pointer; }
        button:hover { background:#C62828; }
    </style>
</head>
<body>

<div class="container">
    <h2>Delete Category</h2>

    <input type="text" id="id" placeholder="Category ID" required>

    <button onclick="deleteCategory()">Delete Category</button>

    <p id="message"></p>
</div>

<script>
async function deleteCategory() {
    const id = document.getElementById("id").value;

    const res = await fetch("https://multi-maniacs-customs-backend.onrender.com/categories/delete", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id })
    });

    const data = await res.json();
    document.getElementById("message").innerText = data.message || data.error;
}
</script>

</body>
</html>
