<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Maniacs Customs</title>

    <!-- MMC Neon Theme -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li class="cart-nav">
            <a href="Cart.html">
                Cart <span id="cart-count" class="cart-badge">0</span>
            </a>
            <div id="mini-cart" class="mini-cart-dropdown"></div>
        </li>
    </ul>
</nav>

<div class="page">
    <h1>Shop</h1>
    <p>Browse available custom products, accessories, and limited-run items.</p>

    <div id="shop-grid" class="grid"></div>
</div>

<footer>
    <p>
        &copy; 2026 Multi-Maniacs Customs LLC • Essie, KY • Clients accepted anywhere in the U.S.
    </p>
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
    async function renderShop() {
        await loadProducts();

        const grid = document.getElementById("shop-grid");
        grid.innerHTML = "";

        products.forEach((p, index) => {
            if (!p.active) return;
            if (p.stock <= 0 && (!p.variants || p.variants.length === 0)) return;

            let stockText = "";
            if (p.variants && p.variants.length > 0) {
                stockText = "Multiple variants available";
            } else {
                stockText = "In stock: " + p.stock;
            }

            grid.innerHTML += `
                <div class="card">
                    <img src="${p.image}" class="cart-img" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>$${p.price.toFixed(2)}</p>
                    <p>${stockText}</p>
                    <a onclick="addToCart('${p._id}')" class="btn">Add to Cart</a>
                </div>
            `;
        });

        updateCartBadge();
        renderMiniCart();
    }

    document.addEventListener("DOMContentLoaded", renderShop);
</script>

</body>
</html>
